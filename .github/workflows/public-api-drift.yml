name: Public API drift (cross-repo notify)

# #51 builder API-stability gate (PR-B), tasks T13/T14.
#
# On push to main, diff src/Strategos/PublicAPI/PublicAPI.Shipped.txt (the
# explicit cross-product API baseline) against the previous release tag. If the
# guarded surface changed, file a tracking issue on lvlup-sw/exarchos so the
# downstream strategos-api-mirror.test.ts mirror can re-baseline deliberately.
#
# FAIL-SOFT ON THE SECRET (design §6.3): if EXARCHOS_ISSUES_PAT is absent the
# notify step warns and is skipped — it NEVER fails the main push. The notify
# logic itself is proved in CI by the mocked-gh dry-run job below (T14), which
# needs no live token. The LIVE cross-repo dry-run against lvlup-sw/exarchos is
# an OUT-OF-BAND manual step the maintainer runs before closing #51 — it is NOT
# run by this workflow.

# Gated surface boundary (#106)
# -----------------------------
# This gate tracks the SEVEN top-level Strategos.Builders entrypoint interfaces
# declared in PublicAPI.Shipped.txt:
#   IApprovalBuilder, IBranchBuilder, IFailureBuilder, IForkJoinBuilder,
#   ILoopBuilder, IStepConfiguration, IWorkflowBuilder.
#
# The FIVE continuation interfaces reachable THROUGH those entrypoints are
#   IForkPathBuilder, ILoopForkJoinBuilder, IApprovalEscalationBuilder,
#   IApprovalRejectionBuilder, IContextBuilder.
# The downstream exarchos strategos-api-mirror still parses only the seven
# historical entrypoint *signatures*, not the transitive type graph. The
# local analyzer allowlist additionally guards the three continuation interfaces
# changed by #167 (ILoopForkJoinBuilder, IApprovalEscalationBuilder, and
# IApprovalRejectionBuilder) plus WorkflowActionReference, the StepDefinition
# carrier property, CompensationConfiguration, and StepContext's rollback-
# identity seam. IForkPathBuilder and IContextBuilder remain transitively
# represented by the historical entrypoints.
#
# Downstream mirror scope is the seven entrypoints; the local baseline is the
# reviewed allowlist documented in src/Strategos/.editorconfig.

# Pre-merge notice (PR #206 follow-up)
# ------------------------------------
# The push-to-main job above tells exarchos AFTER a merge. The mirror-scope-
# changed job below runs on every pull request that touches a PublicAPI
# baseline and, when the mirrored surface changed against the PR base, emits
# a warning annotation and a sticky PR comment naming the changed lines — so a
# reviewer sees that the exarchos mirror will need re-baselining BEFORE the
# merge, not from a downstream build failure afterwards. It needs no PAT
# (GITHUB_TOKEN with pull-requests: write) and never fails the PR.

on:
  push:
    branches: [main]
    paths:
      - 'src/Strategos/PublicAPI/**'
      - 'src/Strategos.Ontology/PublicAPI.Shipped.txt'
      - 'src/Strategos.Ontology/PublicAPI.Unshipped.txt'
      - 'scripts/build-drift-issue.sh'
      - '.github/workflows/public-api-drift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Strategos/PublicAPI/**'
      - 'src/Strategos.Ontology/PublicAPI.Shipped.txt'
      - 'src/Strategos.Ontology/PublicAPI.Unshipped.txt'
      - '.github/workflows/public-api-drift.yml'

permissions:
  contents: read

jobs:
  mirror-scope-changed:
    # Pre-merge: diff every PublicAPI baseline against the PR base and surface
    # a change to the mirrored surface as a warning + sticky comment.
    name: Mirror scope changed? (pre-merge notice)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head (full history for the base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff PublicAPI baselines vs PR base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files=(
            src/Strategos/PublicAPI/PublicAPI.Shipped.txt
            src/Strategos/PublicAPI/PublicAPI.Unshipped.txt
            src/Strategos.Ontology/PublicAPI.Shipped.txt
            src/Strategos.Ontology/PublicAPI.Unshipped.txt
          )
          # The mirrored surface: the seven historical entrypoints plus the
          # reviewed allowlist documented in src/Strategos/.editorconfig.
          mirror_regex='^[-+](static )?Strategos\.(Builders\.I(ApprovalBuilder|BranchBuilder|FailureBuilder|ForkJoinBuilder|LoopBuilder|StepConfiguration|WorkflowBuilder|ForkPathBuilder|LoopForkJoinBuilder|ApprovalEscalationBuilder|ApprovalRejectionBuilder|ContextBuilder)|Definitions\.(WorkflowActionReference|CompensationConfiguration|StepDefinition)|Steps\.StepContext)'
          diff_out="$(git diff --no-color "${BASE_SHA}" HEAD -- "${files[@]}" || true)"
          changed_lines="$(printf '%s\n' "${diff_out}" | grep -E "${mirror_regex}" || true)"
          all_changed="$(printf '%s\n' "${diff_out}" | grep -E '^[-+](static )?Strategos\.' || true)"
          if [ -z "${all_changed}" ]; then
            echo "No PublicAPI baseline line changed against ${BASE_SHA}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ -n "${changed_lines}" ]; then
            echo "mirror=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=exarchos mirror scope changed::This PR changes the public API surface mirrored by lvlup-sw/exarchos strategos-api-mirror.test.ts; the mirror needs re-baselining when this merges."
          else
            echo "mirror=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "<!-- public-api-drift:mirror-scope -->"
            echo "### Public API baseline changed against the PR base"
            echo
            if [ -n "${changed_lines}" ]; then
              echo "**The surface mirrored by \`lvlup-sw/exarchos\` (\`strategos-api-mirror.test.ts\`) changed.** Re-baseline the mirror when this merges; the push-to-main workflow files the tracking issue."
            else
              echo "No mirrored entrypoint changed; the lines below are outside the exarchos mirror scope."
            fi
            echo
            # GitHub rejects a comment body over 65,536 characters (HTTP 422), and a
            # release-prep roll of PublicAPI.Unshipped.txt into Shipped.txt changes
            # thousands of lines. Keep the mirror-scope lines in full — they are the
            # signal — and cap the full diff at a byte budget, naming what was cut.
            budget=48000
            if [ -n "${changed_lines}" ]; then
              echo "Mirrored entrypoints that changed:"
              echo
              echo '```diff'
              printf '%s\n' "${changed_lines}"
              echo '```'
              echo
            fi
            echo "All changed baseline lines:"
            echo
            echo '```diff'
            # Through a file, not a pipe: under pipefail, `printf | head -c` fails
            # with SIGPIPE when head stops reading early.
            all_file="${RUNNER_TEMP}/all_changed.diff"
            printf '%s\n' "${all_changed}" > "${all_file}"
            total_lines="$(wc -l < "${all_file}")"
            head -c "${budget}" "${all_file}"
            shown_lines="$(head -c "${budget}" "${all_file}" | wc -l)"
            if [ "${shown_lines}" -lt "${total_lines}" ]; then
              echo
              echo "# … truncated: ${shown_lines} of ${total_lines} lines shown. The full diff is in the PR's PublicAPI.*.txt files."
            fi
            echo '```'
          } > "${RUNNER_TEMP}/comment.md"
          echo "comment_path=${RUNNER_TEMP}/comment.md" >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment
        if: steps.diff.outputs.changed == 'true'
        # The notice is advisory (see the header): the warning annotation above is
        # the durable signal, so a failure to post or update the comment must not
        # fail the PR.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_PATH: ${{ steps.diff.outputs.comment_path }}
        run: |
          set -euo pipefail
          marker='<!-- public-api-drift:mirror-scope -->'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1 || true)"
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${COMMENT_PATH}" >/dev/null
            echo "Updated sticky comment ${existing}."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"${COMMENT_PATH}" >/dev/null
            echo "Posted sticky comment."
          fi

  notify-on-drift:
    name: Diff baseline + notify exarchos (fail-soft)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Diff shipped baseline vs previous tag
        id: diff
        run: |
          set -euo pipefail
          baseline='src/Strategos/PublicAPI/PublicAPI.Shipped.txt src/Strategos.Ontology/PublicAPI.Shipped.txt'
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -z "${prev_tag}" ]; then
            echo "No previous v* tag found — nothing to diff against; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing ${baseline} : ${prev_tag}..HEAD"
          # shellcheck disable=SC2086 # intentional word-splitting over the baseline list
          if git diff --quiet "${prev_tag}" HEAD -- ${baseline}; then
            echo "Builder baseline unchanged since ${prev_tag}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Builder baseline CHANGED since ${prev_tag}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "diff_url=${{ github.server_url }}/${{ github.repository }}/compare/${prev_tag}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: File cross-repo tracking issue (fail-soft on PAT)
        if: steps.diff.outputs.changed == 'true'
        env:
          EXARCHOS_ISSUES_PAT: ${{ secrets.EXARCHOS_ISSUES_PAT }}
        run: bash scripts/build-drift-issue.sh --diff-url "${{ steps.diff.outputs.diff_url }}"

  mocked-gh-dry-run:
    # T14: proves the notify wiring (--repo/--label/body) end-to-end WITHOUT a
    # live token, using a `gh` shim on PATH that asserts the invocation. Runs on
    # every push to main (alongside notify-on-drift) so the wiring can never
    # silently rot.
    name: Mocked-gh notify dry-run (#51 T14)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mocked gh shim on PATH
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mockbin"
          cat > "${RUNNER_TEMP}/mockbin/gh" <<'SHIM'
          #!/usr/bin/env bash
          # Mocked gh: assert the issue-create invocation, do not hit the network.
          set -euo pipefail
          all="$*"
          fail() { echo "MOCK gh FAIL: $1" >&2; exit 1; }
          case "$1 $2" in
            # Idempotent fail-open label create (#107) runs first; accept it
            # cleanly — it carries no --label/--body/diff flags to assert.
            "label create") echo "MOCK gh OK: label create accepted"; exit 0;;
            "issue create") ;;
            *) fail "expected 'issue create' or 'label create', got '$1 $2'";;
          esac
          [[ "$all" == *"--repo lvlup-sw/exarchos"* ]] || fail "missing --repo lvlup-sw/exarchos"
          [[ "$all" == *"--label cross-product:strategos"* ]] || fail "missing --label cross-product:strategos"
          [[ "$all" == *"--body"* ]] || fail "missing --body"
          [[ "$all" == *"compare/"* ]] || fail "body missing diff link"
          echo "MOCK gh OK: issue create asserted (--repo/--label/body/diff-link)"
          SHIM
          chmod +x "${RUNNER_TEMP}/mockbin/gh"
          echo "${RUNNER_TEMP}/mockbin" >> "$GITHUB_PATH"

      - name: Run notify against synthetic divergence (mocked gh, fake PAT)
        env:
          # Non-empty fake PAT so the script takes the gh branch; the mocked
          # gh shim never authenticates, so no live token is involved.
          EXARCHOS_ISSUES_PAT: 'dry-run-fake-token'
        run: |
          bash scripts/build-drift-issue.sh \
            --diff-url "${{ github.server_url }}/${{ github.repository }}/compare/v0.0.0...${{ github.sha }}"
