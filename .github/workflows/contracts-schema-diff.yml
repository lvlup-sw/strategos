name: Contracts schema breaking-change diff

# T30 — breaking-change detection via JSON Schema structural diff in CI. A
# breaking change advances the minor before 1.0 and the major after 1.0.
#
# Compares the complete schema tree on this ref against the schemas in the
# latest package actually published to NuGet. A removed/narrowed/newly-required
# property requires a minor bump before 1.0 and a major bump after 1.0; an added
# optional property passes after any forward version increment.
#
# The classification rules are unit-tested in C# (JsonSchemaDiff /
# SchemaDiffTests); this workflow drives the same rules over the file set via
# scripts/contracts-schema-diff.mjs.
#
# Two arms run, and both must pass:
#   1. published baseline — the schema tree in the latest package on nuget.org.
#   2. merge base        — the schema tree at this pull request's base commit.
# The published arm alone cannot fail for a product reason while ContractsVersion
# already carries a pre-1.0 minor bump over the published version, because that
# bump permits every narrowing. The merge-base arm compares the versions the PR
# actually moves between, and both arms require every BREAKING change to be named
# by an entry in schemas/breaking-changes.allowlist.json.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Strategos.Contracts/schemas/**'
      - 'src/Strategos.Contracts/Strategos.Contracts.csproj'
      - 'scripts/contracts-schema-diff.mjs'
      - '.github/workflows/contracts-schema-diff.yml'

permissions:
  contents: read

env:
  CONTRACTS_PROJECT: 'src/Strategos.Contracts/Strategos.Contracts.csproj'
  CONTRACTS_SCHEMAS: 'src/Strategos.Contracts/schemas'
  BREAKING_ALLOWLIST: 'src/Strategos.Contracts/schemas/breaking-changes.allowlist.json'

jobs:
  schema-diff:
    name: Structural diff vs published package and merge base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Extract latest published Contracts schemas
        id: prev
        run: |
          set -euo pipefail
          package_id=levelup.strategos.contracts
          package_index="https://api.nuget.org/v3-flatcontainer/$package_id/index.json"
          candidate_version="$(grep -oP '(?<=<ContractsVersion>)[^<]+' "$CONTRACTS_PROJECT")"
          if [[ ! "$candidate_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Candidate ContractsVersion '$candidate_version' is not strict stable SemVer; compatibility is indeterminate."
            exit 2
          fi

          prev_dir="$(mktemp -d)"
          if ! curl --fail --silent --show-error "$package_index" --output "$prev_dir/index.json"; then
            echo "::error::Published Contracts package index is unavailable; schema compatibility is indeterminate."
            exit 2
          fi

          previous_version="$(jq -r '.versions[]' "$prev_dir/index.json" \
            | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V \
            | tail -1 || true)"
          if [[ -z "$previous_version" ]]; then
            echo "::error::No stable published Contracts package exists; schema compatibility is indeterminate."
            exit 2
          fi

          nupkg="$prev_dir/$package_id.$previous_version.nupkg"
          if ! curl --fail --silent --show-error \
            "https://api.nuget.org/v3-flatcontainer/$package_id/$previous_version/$package_id.$previous_version.nupkg" \
            --output "$nupkg"; then
            echo "::error::Published Contracts $previous_version package is unavailable; schema compatibility is indeterminate."
            exit 2
          fi
          if ! unzip -q "$nupkg" 'contentFiles/any/any/schemas/*' -d "$prev_dir/package"; then
            echo "::error::Published Contracts $previous_version package has no readable schema payload; compatibility is indeterminate."
            exit 2
          fi
          published_schemas="$prev_dir/package/contentFiles/any/any/schemas"
          if [[ ! -d "$published_schemas" ]]; then
            echo "::error::Published Contracts $previous_version has no packaged schemas; compatibility is indeterminate."
            exit 2
          fi

          published_nupkg_sha256="$(sha256sum "$nupkg" | cut -d' ' -f1)"
          {
            echo "prev_dir=$published_schemas"
            echo "previous_version=$previous_version"
            echo "candidate_version=$candidate_version"
            echo "published_nupkg_sha256=$published_nupkg_sha256"
          } >> "$GITHUB_OUTPUT"
          echo "comparing candidate $candidate_version against published Contracts $previous_version ($published_nupkg_sha256)"

      - name: Structural breaking-change diff vs published package
        run: |
          node scripts/contracts-schema-diff.mjs \
            "${{ steps.prev.outputs.prev_dir }}" \
            "$CONTRACTS_SCHEMAS" \
            "${{ steps.prev.outputs.previous_version }}" \
            "${{ steps.prev.outputs.candidate_version }}" \
            --allowlist "$BREAKING_ALLOWLIST"

      - name: Materialise the merge-base schema tree
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then
            echo "::error::No pull request base SHA; the merge-base comparison is indeterminate."
            exit 2
          fi

          base_dir="$(mktemp -d)"
          if ! git archive "$BASE_SHA" "$CONTRACTS_SCHEMAS" | tar -x -C "$base_dir"; then
            echo "::error::Merge base $BASE_SHA has no readable schema tree; compatibility is indeterminate."
            exit 2
          fi

          base_schemas="$base_dir/$CONTRACTS_SCHEMAS"
          if [[ ! -d "$base_schemas" ]]; then
            echo "::error::Merge base $BASE_SHA has no $CONTRACTS_SCHEMAS directory; compatibility is indeterminate."
            exit 2
          fi

          base_version="$(git show "$BASE_SHA:$CONTRACTS_PROJECT" \
            | grep -oP '(?<=<ContractsVersion>)[^<]+' || true)"
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Merge-base ContractsVersion '$base_version' is not strict stable SemVer; compatibility is indeterminate."
            exit 2
          fi

          {
            echo "base_dir=$base_schemas"
            echo "base_version=$base_version"
          } >> "$GITHUB_OUTPUT"
          echo "comparing candidate ${{ steps.prev.outputs.candidate_version }} against merge base $BASE_SHA ($base_version)"

      - name: Structural breaking-change diff vs merge base
        # --allow-equal-versions lets an additive PR that does not move
        # ContractsVersion pass. It does NOT relax the breaking rule: with equal
        # versions permitsBreakingChange() is false, so any BREAKING change here
        # still exits 1 and demands a ContractsVersion bump plus an allowlist entry.
        run: |
          node scripts/contracts-schema-diff.mjs \
            "${{ steps.base.outputs.base_dir }}" \
            "$CONTRACTS_SCHEMAS" \
            "${{ steps.base.outputs.base_version }}" \
            "${{ steps.prev.outputs.candidate_version }}" \
            --allowlist "$BREAKING_ALLOWLIST" \
            --allow-equal-versions
