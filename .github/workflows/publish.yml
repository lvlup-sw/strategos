name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'
  SOLUTION_PATH: 'strategos.slnx'

# Required for trusted publishing (OIDC)
permissions:
  id-token: write   # OIDC token for NuGet trusted publishing
  contents: write   # Create GitHub Releases
  packages: write   # Push packages

jobs:
  publish:
    name: Publish to NuGet
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: nuget-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for MinVer and git-cliff
          fetch-tags: true  # Explicitly fetch tags for version detection

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Test (verify before publish)
        # Mirror ci.yml's skip-patterns. This .NET-only publish runner does not
        # provision Node, so *Contracts.Tests* (which shell out to `npx tsp
        # compile` — @typespec/compiler needs Node 22+) false-fail here; they are
        # already gated in ci.yml's Node-provisioned job and re-run by the
        # contracts-v* publish workflow, and this workflow does not publish the
        # version-pinned Contracts package (see the exclusion step after Pack).
        # *Benchmarks.Tests* are perf,
        # not a release gate (skipped in ci.yml too).
        run: |
          for proj in src/*Tests/*.csproj tests/*Tests/*.csproj; do
            case "$proj" in
              *Benchmarks.Tests*|*Contracts.Tests*)
                echo "Skipping $(basename "$proj") (verified elsewhere; see step comment)"
                continue ;;
            esac
            echo "Testing $(basename "$proj")..."
            dotnet run --project "$proj" --configuration Release --no-build
          done

      - name: Pack
        run: dotnet pack ${{ env.SOLUTION_PATH }} --no-build --configuration Release --output ./packages

      - name: List packages
        run: ls -la ./packages/

      - name: Exclude the independently versioned Contracts package
        # Strategos.Contracts is pinned (MinVerSkip) and is published by
        # publish-contracts.yml from a `contracts-v*` tag, behind its own gates:
        # tag equals the pinned version, regenerate-and-diff, breaking-change
        # diff against the published baseline, and the fixture-corpus floor.
        # Packing the solution still emits its nupkg, and pushing it from here
        # would publish it with none of those gates run (the v2.10.0 run pushed
        # Contracts 0.4.0 and survived only as a duplicate). Drop it so this
        # workflow ships the MinVer-versioned packages only. The core package's
        # nuspec depends on the pinned Contracts version, so the `contracts-v*`
        # tag is published before the `v*` tag.
        run: |
          rm -f ./packages/LevelUp.Strategos.Contracts.*
          ls -la ./packages/

      - name: NuGet login (OIDC)
        id: login
        # SHA-pinned: this step mints the NuGet push credential from the OIDC
        # token, so a moved tag would swap the code that handles it. Renovate
        # tracks the trailing version comment.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: |
          for package in ./packages/*.nupkg; do
            echo "Pushing $package..."
            dotnet nuget push "$package" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push symbols
        run: |
          for package in ./packages/*.snupkg; do
            if [ -f "$package" ]; then
              echo "Pushing symbols $package..."
              dotnet nuget push "$package" \
                --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./packages/*
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: false
          # A hyphen in the tag (v3.0.0-rc.1) is a SemVer pre-release: mark the
          # release as such and keep it off "latest" so consumers pinning the
          # newest stable release are not pointed at a candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

      - name: Deprecate old packages
        if: success()
        continue-on-error: true  # Don't fail release if deprecation fails (e.g. already deprecated)
        run: |
          OLD_PACKAGES=(
            "Agentic.Workflow:LevelUp.Strategos"
            "Agentic.Workflow.Agents:LevelUp.Strategos.Agents"
            "Agentic.Workflow.Infrastructure:LevelUp.Strategos.Infrastructure"
            "Agentic.Workflow.Rag:LevelUp.Strategos.Rag"
            "Agentic.Workflow.Generators:LevelUp.Strategos.Generators"
            "Strategos:LevelUp.Strategos"
            "Strategos.Agents:LevelUp.Strategos.Agents"
            "Strategos.Infrastructure:LevelUp.Strategos.Infrastructure"
            "Strategos.Rag:LevelUp.Strategos.Rag"
            "Strategos.Generators:LevelUp.Strategos.Generators"
          )
          for entry in "${OLD_PACKAGES[@]}"; do
            old="${entry%%:*}"
            new="${entry##*:}"
            echo "Deprecating $old -> $new"
            dotnet nuget deprecate "$old" \
              --all-versions \
              --alternate-package "$new" \
              --message "Renamed to $new. See https://github.com/lvlup-sw/strategos for migration guide." \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} || true
          done
