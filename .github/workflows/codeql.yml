# GitHub Actions owns main and weekly C# scans. Buildkite owns PR scans.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 07:00 UTC.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    permissions:
      contents: read
      security-events: write   # upload CodeQL results to the Security tab
      actions: read            # read the base run for the PR overlay cache
    uses: ./.github/workflows/lvlup-codeql-ffd6fb4.yml
    with:
      languages: csharp
      build-mode: none
