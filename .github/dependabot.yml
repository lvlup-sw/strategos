# Dependabot updates action pins in the remaining GitHub workflows.
# Buildkite selects and runs PR validation.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: "ci"
    # One grouped PR per run keeps action-bump noise low.
    groups:
      github-actions:
        patterns:
          - "*"
